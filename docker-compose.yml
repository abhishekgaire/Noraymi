# Local development: Postgres 16, an S3-compatible store and a mail catcher.
# `docker compose up -d`, then `pnpm db:migrate`.
services:
  postgres:
    image: postgres:16.15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: west4
      POSTGRES_PASSWORD: west4
      POSTGRES_DB: west4
    command: ["postgres", "-c", "timezone=UTC"]
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./packages/db/local/init-roles.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U west4 -d west4"]
      interval: 2s
      timeout: 3s
      retries: 30

  # RustFS speaks the S3 API, including object lock. MinIO no longer publishes
  # public images, so it isn't an option on a fresh clone.
  s3:
    image: rustfs/rustfs:1.0.1-preview.11
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: west4
      RUSTFS_SECRET_KEY: west4secret
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - s3:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Creates the three buckets once the store is up. west4-audit has object lock
  # on for the daily write-once audit export (M1-07).
  s3-init:
    image: amazon/aws-cli:2.32.28
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: west4
      AWS_SECRET_ACCESS_KEY: west4secret
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        s3="aws --endpoint-url http://s3:9000 s3api"
        $$s3 head-bucket --bucket west4-files 2>/dev/null || $$s3 create-bucket --bucket west4-files
        # Browsers upload photos straight to the bucket with a presigned POST (M2-13, M2-21): the local staff and guest apps may.
        $$s3 put-bucket-cors --bucket west4-files --cors-configuration '{"CORSRules":[{"AllowedOrigins":["http://localhost:5173","http://localhost:3001"],"AllowedMethods":["GET","POST"],"AllowedHeaders":["*"],"MaxAgeSeconds":3000}]}'
        $$s3 head-bucket --bucket west4-audit 2>/dev/null || $$s3 create-bucket --bucket west4-audit --object-lock-enabled-for-bucket
        $$s3 get-object-lock-configuration --bucket west4-audit
        # The ID-scan keys (M8-14): unversioned, never backed up; deleting a key destroys it.
        $$s3 head-bucket --bucket west4-id-keys 2>/dev/null || $$s3 create-bucket --bucket west4-id-keys
        echo "buckets ready"

  # The local mail catcher (M1-18): every email the worker sends locally lands
  # here instead of a real inbox. SMTP on 1025, the inbox and API on 8025.
  mailpit:
    image: axllent/mailpit:v1.31.3
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres:
  s3:
