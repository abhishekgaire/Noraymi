packages:
  - apps/*
  - packages/*

# Dependencies allowed to run install scripts. Everything else is blocked.
allowBuilds:
  electron: true
  esbuild: true
  better-sqlite3-multiple-ciphers: true
  # The USB NFC reader's PC/SC binding (M1-30): node-gyp, needs the platform's PC/SC headers.
  "@pokusew/pcsclite": true

minimumReleaseAgeExclude:
  - nodemailer@10.0.13
