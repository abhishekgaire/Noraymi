packages:
  - apps/*
  - packages/*

# Dependencies allowed to run install scripts. Everything else is blocked.
allowBuilds:
  electron: true
  esbuild: true
  better-sqlite3-multiple-ciphers: true
  # The USB NFC reader's PC/SC binding (M1-30): node-gyp, needs the platform's PC/SC headers.
  "@pokusew/pcsclite": true
  # electron-builder's Windows installer helper: its script isn't needed to build or test, so it stays blocked.
  electron-winstaller: false

minimumReleaseAgeExclude:
  - nodemailer@10.0.13

# Security fixes for transitive dependencies (M8-19: CI fails a merge on high and critical findings).
overrides:
  source-map-js: ">=1.2.2"
  http-cache-semantics: ">=4.3.0"
