name: Set up Node and pnpm
description: Node 22 from .nvmrc, pnpm through corepack, and a frozen install
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
    - run: corepack enable
      shell: bash
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
