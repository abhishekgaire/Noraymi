name: Payment page check

# M4-15: the payment page's scripts and headers are compared with the policy in
# apps/guest/pay-policy.ts after every staging deploy and once a week, so a change
# nobody approved (a new script, a loosened header) raises an alert. The page to
# load is STAGING_PAY_CHECK_URL: a pay link kept open on staging for this check.
# Until staging has a pay hostname the check is skipped with a notice.
#
# M8-19: a failing run pages us and a passing run clears the page. The result is
# published to the pages topic in the shape of a CloudWatch alarm
# ("rule:pay-page-check"), so the API's alarm hook takes it like any other
# alarm (runbook docs/runbooks/pay-page-check.md). Needs the repository
# variables AWS_CHECKS_ROLE_ARN and PAGES_TOPIC_ARN (terraform outputs); until
# they're set the result is only shown here.

permissions:
  id-token: write
  contents: read

on:
  workflow_run:
    workflows: ["Deploy staging"]
    types: [completed]
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch:

jobs:
  check:
    name: Payment page matches its policy
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Check the live payment page
        id: check
        env:
          PAY_URL: ${{ vars.STAGING_PAY_CHECK_URL }}
        run: |
          if [ -z "$PAY_URL" ]; then
            echo "::notice::STAGING_PAY_CHECK_URL isn't set yet (staging has no pay hostname); skipped"
            exit 0
          fi
          pnpm --filter @west4/guest check:pay -- "$PAY_URL"
      - name: Tell the pages topic
        if: always() && vars.AWS_CHECKS_ROLE_ARN != '' && vars.PAGES_TOPIC_ARN != '' && steps.check.outcome != 'skipped'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_CHECKS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Page on a failure, clear on a pass
        if: always() && vars.AWS_CHECKS_ROLE_ARN != '' && vars.PAGES_TOPIC_ARN != '' && steps.check.outcome != 'skipped'
        env:
          TOPIC: ${{ vars.PAGES_TOPIC_ARN }}
          STATE: ${{ steps.check.outcome == 'success' && 'OK' || 'ALARM' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/pay-check-alarm.mjs "$STATE" "$RUN_URL" > message.json
          aws sns publish --topic-arn "$TOPIC" --message file://message.json
