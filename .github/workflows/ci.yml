name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm i18n:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  migration-lint:
    name: Migration lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm db:lint

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test:unit

  integration:
    name: Integration tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: west4
          POSTGRES_PASSWORD: west4
          POSTGRES_DB: west4
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U west4 -d west4"
          --health-interval 2s --health-timeout 3s --health-retries 30
      s3:
        image: rustfs/rustfs:1.0.1-preview.11
        env:
          RUSTFS_ACCESS_KEY: west4
          RUSTFS_SECRET_KEY: west4secret
        ports: ["9000:9000"]
      mailpit:
        image: axllent/mailpit:v1.31.3
        ports: ["1025:1025", "8025:8025"]
    env:
      DATABASE_URL: postgres://west4:west4@localhost:5432/west4
      SMTP_URL: smtp://localhost:1025
      MAILPIT_URL: http://localhost:8025
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: west4
      S3_SECRET_ACCESS_KEY: west4secret
      S3_BUCKET_FILES: west4-files
      S3_BUCKET_AUDIT: west4-audit
      S3_BUCKET_ID_KEYS: west4-id-keys
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Create the local buckets (the audit bucket with Object Lock)
        env:
          AWS_ACCESS_KEY_ID: west4
          AWS_SECRET_ACCESS_KEY: west4secret
          AWS_DEFAULT_REGION: us-east-1
          AWS_ENDPOINT_URL: http://localhost:9000
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:9000/health && break; sleep 2; done
          aws s3api create-bucket --bucket west4-files
          aws s3api create-bucket --bucket west4-audit --object-lock-enabled-for-bucket
          aws s3api create-bucket --bucket west4-id-keys
      - run: pnpm db:migrate
      - name: A second run applies nothing
        run: pnpm db:migrate | tee /dev/stderr | grep -q "nothing to apply"
      # The menu PDF job prints with Chromium (M3-05); its test checks the tagged PDF.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:integration

  load:
    name: Friday-night load test (on its own, M8-21)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: west4
          POSTGRES_PASSWORD: west4
          POSTGRES_DB: west4
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U west4 -d west4"
          --health-interval 2s --health-timeout 3s --health-retries 30
      s3:
        image: rustfs/rustfs:1.0.1-preview.11
        env:
          RUSTFS_ACCESS_KEY: west4
          RUSTFS_SECRET_KEY: west4secret
        ports: ["9000:9000"]
      mailpit:
        image: axllent/mailpit:v1.31.3
        ports: ["1025:1025", "8025:8025"]
    env:
      DATABASE_URL: postgres://west4:west4@localhost:5432/west4
      SMTP_URL: smtp://localhost:1025
      MAILPIT_URL: http://localhost:8025
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: west4
      S3_SECRET_ACCESS_KEY: west4secret
      S3_BUCKET_FILES: west4-files
      S3_BUCKET_AUDIT: west4-audit
      S3_BUCKET_ID_KEYS: west4-id-keys
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Create the local buckets (the audit bucket with Object Lock)
        env:
          AWS_ACCESS_KEY_ID: west4
          AWS_SECRET_ACCESS_KEY: west4secret
          AWS_DEFAULT_REGION: us-east-1
          AWS_ENDPOINT_URL: http://localhost:9000
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:9000/health && break; sleep 2; done
          aws s3api create-bucket --bucket west4-files
          aws s3api create-bucket --bucket west4-audit --object-lock-enabled-for-bucket
          aws s3api create-bucket --bucket west4-id-keys
      - run: pnpm db:migrate
      # Timing-bound (the bar alarm within 3 s), so never beside the integration suite.
      - run: pnpm test:load

  principals:
    name: Principal suite (every route as every principal)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: west4
          POSTGRES_PASSWORD: west4
          POSTGRES_DB: west4
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U west4 -d west4"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://west4:west4@localhost:5432/west4
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm db:migrate
      - run: pnpm test:principals

  walls:
    name: Venue-wall suite (routes, jobs and webhooks)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: west4
          POSTGRES_PASSWORD: west4
          POSTGRES_DB: west4
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U west4 -d west4"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://west4:west4@localhost:5432/west4
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm db:migrate
      - run: pnpm test:walls

  e2e:
    name: Smoke (${{ matrix.app }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        app: [api, staff, console, guest, desktop]
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: west4
          POSTGRES_PASSWORD: west4
          POSTGRES_DB: west4
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U west4 -d west4"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://west4:west4@localhost:5432/west4
      APP_DATABASE_URL: postgres://west4:west4@localhost:5432/west4
      WEST4_ENV: local
      ALLOW_STAGING_FEATURES: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      - run: xvfb-run -a pnpm e2e --project ${{ matrix.app }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-${{ matrix.app }}
          path: playwright-report
          retention-days: 7
      # The Spanish review's screenshots and sign-off index (M9-12), for the fluent reviewer.
      - uses: actions/upload-artifact@v7
        if: always() && matrix.app == 'staff'
        with:
          name: spanish-review
          path: spanish-review
          retention-days: 30

  dependencies:
    name: Dependency scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm audit --audit-level=high

  container:
    name: Container scan (${{ matrix.app }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        app: [api, guest]
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f apps/${{ matrix.app }}/Dockerfile -t west4-${{ matrix.app }}:ci .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: west4-${{ matrix.app }}:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
